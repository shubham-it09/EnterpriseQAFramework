services:
  playwright:
    build: .

    container_name: enterprise-playwright

    environment:
      ENVIRONMENT: ${ENVIRONMENT:-qa}
      BROWSER: ${BROWSER:-chromium}
      EXECUTION_TYPE: ${EXECUTION_TYPE:-ui}
      HEADLESS: ${HEADLESS:-true}

    volumes:
      - ./artifacts:/app/artifacts

    command: >
      sh -c "
      if [ \"$EXECUTION_TYPE\" = \"ui\" ]; then
          pytest tests;
      elif [ \"$EXECUTION_TYPE\" = \"api\" ]; then
          pytest api/tests;
      else
          pytest tests api/tests;
      fi
      "